<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Heart Rate — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0f14;
    --surface: #151a22;
    --surface-2: #1b212b;
    --border: #262e3a;
    --pulse: #ff6152;
    --wave: #6fe3d1;
    --text: #f4efe6;
    --text-muted: #8891a3;
    --text-dim: #4b5263;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
  }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background:
      radial-gradient(ellipse 600px 400px at 50% 38%, rgba(255,97,82,0.07), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .card{
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .eyebrow{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    width: 100%;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .status{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px 5px 9px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .status-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .status-dot[data-state="live"]{
    background: var(--wave);
    box-shadow: 0 0 9px 1px rgba(111,227,209,0.7);
  }
  .status-dot[data-state="connecting"]{
    background: var(--text-muted);
    animation: dimflicker 1.1s ease-in-out infinite;
  }
  .status-dot[data-state="disconnected"]{
    background: var(--pulse);
    box-shadow: 0 0 9px 1px rgba(255,97,82,0.55);
  }
  @keyframes dimflicker{
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  .pulse-wrap{
    position: relative;
    width: clamp(200px, 56vw, 250px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pulse-ring{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--pulse);
    transform-origin: center;
  }
  .pulse-ring--inner{ inset: 14px; }
  .pulse-ring--outer{ animation-delay: 0.06s; opacity: 0.6; }

  .reading[data-state="live"] .pulse-ring{
    animation-name: beat;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  @keyframes beat{
    0%   { transform: scale(1);    opacity: .45; }
    14%  { transform: scale(1.12); opacity: 1; }
    28%  { transform: scale(1.02); opacity: .8; }
    42%  { transform: scale(1.07); opacity: .9; }
    70%  { transform: scale(1);    opacity: .45; }
    100% { transform: scale(1);    opacity: .45; }
  }

  @media (prefers-reduced-motion: reduce){
    .reading[data-state="live"] .pulse-ring{ animation: none; opacity: .75; }
  }

  .numeral-block{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .bpm-value{
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .bpm-label{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .stats-row{
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 6px;
  }

  .stat{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 0 8px;
    border-left: 1px solid var(--border);
  }
  .stat:first-child{ border-left: none; }

  .stat-label{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .stat-value{
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 600;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .reset-link{
    background: none;
    border: none;
    padding: 0;
    font-family: var(--font-sans);
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .reset-link:hover{ color: var(--text-muted); }
</style>
</head>
<body>

<div class="card">

  <div class="eyebrow">
    <span class="status">
      <span class="status-dot" id="status-dot" data-state="connecting"></span>
      <span id="status-text">Connecting</span>
    </span>
  </div>

  <div class="pulse-wrap reading" id="reading" data-state="connecting">
    <div class="pulse-ring pulse-ring--outer"></div>
    <div class="pulse-ring pulse-ring--inner"></div>
    <div class="numeral-block">
      <div class="bpm-value" id="bpm-value" aria-live="polite">--</div>
      <div class="bpm-label">BPM</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <span class="stat-label">Min</span>
      <span class="stat-value" id="stat-min">--</span>
    </div>
    <div class="stat">
      <span class="stat-label">Avg</span>
      <span class="stat-value" id="stat-avg">--</span>
    </div>
    <div class="stat">
      <span class="stat-label">Max</span>
      <span class="stat-value" id="stat-max">--</span>
    </div>
    <div class="stat">
      <button class="reset-link" id="reset-btn" aria-label="Reset session stats">reset</button>
    </div>
  </div>

</div>

<script>
(function(){
  const DEFAULT_TOKEN = ' 6d580f10-c59f-4351-8c87-391596e914d2';
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const els = {
    statusDot: document.getElementById('status-dot'),
    statusText: document.getElementById('status-text'),
    reading: document.getElementById('reading'),
    bpmValue: document.getElementById('bpm-value'),
    statMin: document.getElementById('stat-min'),
    statAvg: document.getElementById('stat-avg'),
    statMax: document.getElementById('stat-max'),
    resetBtn: document.getElementById('reset-btn'),
  };

  let ws = null;
  let reconnectAttempts = 0;
  let reconnectTimer = null;
  let currentToken = DEFAULT_TOKEN;

  let minBpm = Infinity, maxBpm = -Infinity, sumBpm = 0, count = 0;

  function setStatus(state){
    els.statusDot.dataset.state = state;
    els.reading.dataset.state = state;
    els.statusText.textContent =
      state === 'connecting' ? 'Connecting' :
      state === 'live' ? 'Live' : 'Disconnected';
  }

  function cleanupSocket(){
    clearTimeout(reconnectTimer);
    if (ws){
      ws.onopen = null;
      ws.onmessage = null;
      ws.onclose = null;
      ws.onerror = null;
      try { ws.close(); } catch(e){}
      ws = null;
    }
  }

  function scheduleReconnect(){
    clearTimeout(reconnectTimer);
    const delay = Math.min(30000, 1000 * Math.pow(1.7, reconnectAttempts));
    reconnectAttempts++;
    reconnectTimer = setTimeout(() => connect(currentToken), delay);
  }

  function connect(token){
    if (!token) return;
    cleanupSocket();
    currentToken = token;
    setStatus('connecting');

    let url;
    try{
      url = `wss://dev.pulsoid.net/api/v1/data/real_time?access_token=${encodeURIComponent(token)}`;
      ws = new WebSocket(url);
    } catch(e){
      setStatus('disconnected');
      scheduleReconnect();
      return;
    }

    ws.onopen = () => {
      reconnectAttempts = 0;
      setStatus('live');
    };

    ws.onmessage = (event) => {
      try{
        const msg = JSON.parse(event.data);
        const bpm = msg && msg.data ? msg.data.heart_rate : undefined;
        if (typeof bpm === 'number' && isFinite(bpm)){
          handleReading(bpm);
        }
      } catch(e){ /* ignore malformed frame */ }
    };

    ws.onclose = () => {
      setStatus('disconnected');
      scheduleReconnect();
    };

    ws.onerror = () => {
      try { ws.close(); } catch(e){}
    };
  }

  function handleReading(bpm){
    setStatus('live');
    els.bpmValue.textContent = Math.round(bpm);
    updatePulseTiming(bpm);
    updateStats(bpm);
  }

  function updatePulseTiming(bpm){
    if (reduceMotion) return;
    const duration = Math.max(0.3, 60 / bpm).toFixed(3);
    document.querySelectorAll('.pulse-ring').forEach((ring) => {
      ring.style.animationDuration = duration + 's';
    });
  }

  function updateStats(bpm){
    minBpm = Math.min(minBpm, bpm);
    maxBpm = Math.max(maxBpm, bpm);
    sumBpm += bpm;
    count += 1;
    els.statMin.textContent = Math.round(minBpm);
    els.statMax.textContent = Math.round(maxBpm);
    els.statAvg.textContent = Math.round(sumBpm / count);
  }

  function resetStats(){
    minBpm = Infinity; maxBpm = -Infinity; sumBpm = 0; count = 0;
    els.statMin.textContent = '--';
    els.statAvg.textContent = '--';
    els.statMax.textContent = '--';
  }

  els.resetBtn.addEventListener('click', resetStats);

  // Auto-connect on load with the embedded token
  connect(DEFAULT_TOKEN);
})();
</script>

</body>
</html>
